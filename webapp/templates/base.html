<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}办公自动化工具包{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
      background: #f5f7fb; color: #1f2937; line-height: 1.6;
    }
    .wrap { max-width: 860px; margin: 0 auto; padding: 32px 20px 64px; }
    header { margin-bottom: 28px; }
    h1 { font-size: 26px; margin: 0 0 6px; color: #1f3864; }
    .sub { color: #6b7280; font-size: 14px; margin: 0; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
    .card {
      background: #fff; border: 1px solid #e5e7eb; border-radius: 10px;
      padding: 16px 18px; text-decoration: none; color: inherit;
      display: block; transition: box-shadow .15s, border-color .15s;
    }
    .card:hover { border-color: #2e75b6; box-shadow: 0 2px 10px rgba(46,117,182,.12); }
    .card .no { font-size: 12px; color: #2e75b6; font-weight: 700; }
    .card .name { font-size: 16px; font-weight: 600; margin: 4px 0 6px; }
    .card .desc { font-size: 13px; color: #6b7280; }
    .card.soon { background: #fafafa; border-style: dashed; cursor: default; }
    .card.soon:hover { border-color: #e5e7eb; box-shadow: none; }
    .badge { font-size: 11px; color: #9ca3af; margin-left: 6px; }
    .panel { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 22px; }
    label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
    input[type=file] {
      display: block; width: 100%; padding: 12px; border: 1px dashed #cbd5e1;
      border-radius: 8px; background: #fafbfc; font-size: 14px;
    }
    button {
      margin-top: 18px; padding: 11px 22px; font-size: 15px; font-weight: 600;
      color: #fff; background: #2e75b6; border: 0; border-radius: 8px; cursor: pointer;
    }
    button:hover { background: #255f96; }
    .error {
      background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c;
      padding: 12px 14px; border-radius: 8px; margin-bottom: 18px; font-size: 14px;
    }
    .hint { font-size: 13px; color: #6b7280; margin-top: 10px; }
    a.back { display: inline-block; margin-bottom: 18px; font-size: 14px; color: #2e75b6; text-decoration: none; }
    footer { margin-top: 40px; font-size: 12px; color: #9ca3af; text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    {% block content %}{% endblock %}
    <footer>办公自动化工具包 · 本地网页版</footer>
  </div>
</body>
</html>
