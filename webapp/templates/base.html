<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}办公自动化工具包{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
      background: #f5f7fb; color: #1f2937; line-height: 1.6;
    }
    .wrap { max-width: 860px; margin: 0 auto; padding: 32px 20px 64px; }
    header { margin-bottom: 28px; }
    h1 { font-size: 26px; margin: 0 0 6px; color: #1f3864; }
    .sub { color: #6b7280; font-size: 14px; margin: 0; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
    .card {
      background: #fff; border: 1px solid #e5e7eb; border-radius: 10px;
      padding: 16px 18px; text-decoration: none; color: inherit;
      display: block; transition: box-shadow .15s, border-color .15s;
    }
    .card:hover { border-color: #2e75b6; box-shadow: 0 2px 10px rgba(46,117,182,.12); }
    .card .no { font-size: 12px; color: #2e75b6; font-weight: 700; }
    .card .name { font-size: 16px; font-weight: 600; margin: 4px 0 6px; }
    .card .desc { font-size: 13px; color: #6b7280; }
    .card.soon { background: #fafafa; border-style: dashed; cursor: default; }
    .card.soon:hover { border-color: #e5e7eb; box-shadow: none; }
    .badge { font-size: 11px; color: #9ca3af; margin-left: 6px; }
    .panel { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 22px; }
    label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
    input[type=file] {
      display: block; width: 100%; padding: 12px; border: 1px dashed #cbd5e1;
      border-radius: 8px; background: #fafbfc; font-size: 14px;
    }
    /* 拖拽上传区：file input 铺满整个区域但透明，点哪都能弹出选择框 */
    .dropzone {
      position: relative; border: 2px dashed #cbd5e1; border-radius: 10px;
      background: #fafbfc; padding: 26px 18px; text-align: center;
      transition: border-color .15s, background .15s;
    }
    .dropzone:hover { border-color: #2e75b6; background: #f6faff; }
    .dropzone.over { border-color: #2e75b6; background: #eaf3fb; }
    .dropzone.has-file { border-style: solid; border-color: #548235; background: #f7fbf5; }
    .dropzone input[type=file] {
      position: absolute; inset: 0; width: 100%; height: 100%;
      opacity: 0; cursor: pointer; padding: 0; border: 0;
    }
    .dz-hint { font-size: 14px; color: #4b5563; font-weight: 500; }
    .dz-sub { font-size: 12px; color: #9ca3af; margin-top: 6px; }
    .dz-list {
      font-size: 12px; color: #2f6b2f; margin-top: 10px;
      word-break: break-all; line-height: 1.7;
    }
    button {
      margin-top: 18px; padding: 11px 22px; font-size: 15px; font-weight: 600;
      color: #fff; background: #2e75b6; border: 0; border-radius: 8px; cursor: pointer;
    }
    button:hover { background: #255f96; }
    .error {
      background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c;
      padding: 12px 14px; border-radius: 8px; margin-bottom: 18px; font-size: 14px;
    }
    .hint { font-size: 13px; color: #6b7280; margin-top: 10px; }
    input[type=text] {
      display: block; width: 100%; padding: 10px 12px; font-size: 14px;
      border: 1px solid #cbd5e1; border-radius: 8px; background: #fff;
      font-family: inherit;
    }
    input[type=text]:focus { outline: none; border-color: #2e75b6; }
    a.back { display: inline-block; margin-bottom: 18px; font-size: 14px; color: #2e75b6; text-decoration: none; }
    a.btn {
      display: inline-block; margin-top: 20px; padding: 11px 22px;
      font-size: 15px; font-weight: 600; color: #fff; background: #548235;
      border-radius: 8px; text-decoration: none;
    }
    a.btn:hover { background: #446a2b; }
    .ok {
      background: #f0f9f0; border: 1px solid #bbdfbb; color: #2f6b2f;
      padding: 10px 14px; border-radius: 8px; font-size: 14px; margin-bottom: 18px;
    }
    table.report { border-collapse: collapse; font-size: 14px; }
    table.report th {
      text-align: left; padding: 7px 18px 7px 0; font-weight: 600; color: #374151;
      white-space: nowrap;
    }
    table.report td { padding: 7px 0; color: #1f2937; }
    .tablewrap { overflow-x: auto; border: 1px solid #e5e7eb; border-radius: 8px; }
    table.preview { border-collapse: collapse; font-size: 12px; width: 100%; }
    table.preview th, table.preview td {
      padding: 7px 10px; border-bottom: 1px solid #eef1f5; text-align: left;
      white-space: nowrap;
    }
    table.preview th { background: #f7f9fc; font-weight: 600; color: #374151; }
    table.preview tr:last-child td { border-bottom: 0; }
    footer { margin-top: 40px; font-size: 12px; color: #9ca3af; text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    {% block content %}{% endblock %}
    <footer>办公自动化工具包 · 本地网页版</footer>
  </div>

  <script>
  // 把每个 file input 变成可拖拽的上传区。
  // 不想在 6 个模板里各写一遍，所以放在 base.html 里统一处理。
  (function () {
    document.querySelectorAll('input[type=file]').forEach(function (input) {
      var zone = document.createElement('div');
      zone.className = 'dropzone';
      input.parentNode.insertBefore(zone, input);
      zone.appendChild(input);

      var hint = document.createElement('div');
      hint.className = 'dz-hint';
      hint.textContent = input.multiple ? '把文件拖到这里，或点击选择' : '把文件拖到这里，或点击选择';
      zone.appendChild(hint);

      var sub = document.createElement('div');
      sub.className = 'dz-sub';
      sub.textContent = input.multiple
        ? '支持一次选多个文件（按住 Ctrl 点选，或直接拖一批进来）'
        : '一次只能传一个文件';
      zone.appendChild(sub);

      var list = document.createElement('div');
      list.className = 'dz-list';
      zone.appendChild(list);

      function render() {
        var files = Array.prototype.slice.call(input.files || []);
        if (!files.length) {
          list.textContent = '';
          zone.classList.remove('has-file');
          return;
        }
        zone.classList.add('has-file');
        var names = files.map(function (f) { return f.name; }).join('、');
        list.textContent = '已选择 ' + files.length + ' 个文件：' + names;
      }

      ['dragenter', 'dragover'].forEach(function (ev) {
        zone.addEventListener(ev, function (e) {
          e.preventDefault();
          zone.classList.add('over');
        });
      });
      ['dragleave', 'dragend'].forEach(function (ev) {
        zone.addEventListener(ev, function () { zone.classList.remove('over'); });
      });
      zone.addEventListener('drop', function (e) {
        e.preventDefault();
        zone.classList.remove('over');
        var dt = e.dataTransfer;
        if (!dt || !dt.files || !dt.files.length) return;
        var dt2 = new DataTransfer();
        if (input.multiple) {
          Array.prototype.forEach.call(dt.files, function (f) { dt2.items.add(f); });
        } else {
          dt2.items.add(dt.files[0]);
        }
        input.files = dt2.files;
        render();
      });
      input.addEventListener('change', render);
      render();
    });
  })();
  </script>
</body>
</html>
